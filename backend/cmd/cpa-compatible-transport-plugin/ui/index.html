<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPA-Compatible Transport</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 260px; }
    main { max-width: 720px; padding: 24px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 20px; line-height: 1.35; letter-spacing: 0; }
    .version { color: color-mix(in srgb, CanvasText 62%, transparent); font: 12px/1.4 ui-monospace, monospace; }
    .profile {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px 20px;
      margin: 24px 0;
      padding: 16px 0;
      border-block: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
    }
    .profile span { color: color-mix(in srgb, CanvasText 68%, transparent); }
    .profile strong { text-align: right; font-size: 14px; }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .setting-copy { min-width: 0; }
    .setting-copy strong { display: block; font-size: 15px; }
    .setting-copy small { display: block; margin-top: 5px; color: color-mix(in srgb, CanvasText 68%, transparent); line-height: 1.45; }
    .switch { position: relative; flex: 0 0 auto; width: 44px; height: 24px; }
    .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .track { position: absolute; inset: 0; border-radius: 12px; background: color-mix(in srgb, CanvasText 22%, transparent); transition: background .15s; }
    .track::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: Canvas; box-shadow: 0 1px 3px #0004; transition: transform .15s; }
    .switch input:checked + .track { background: #16724b; }
    .switch input:checked + .track::after { transform: translateX(20px); }
    .switch input:focus-visible + .track { outline: 2px solid #16724b; outline-offset: 3px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    button { min-height: 38px; padding: 8px 14px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 6px; background: Canvas; color: CanvasText; font: inherit; cursor: pointer; }
    button.primary { border-color: #16724b; background: #16724b; color: white; }
    button:disabled { cursor: wait; opacity: .55; }
    output { display: block; min-height: 22px; margin-top: 16px; color: color-mix(in srgb, CanvasText 72%, transparent); font-size: 13px; line-height: 1.5; }
    output[data-error="true"] { color: #b42318; }
    @media (max-width: 480px) {
      main { padding: 18px; }
      header, .setting { align-items: flex-start; }
      .profile { grid-template-columns: 1fr; gap: 3px; }
      .profile strong { margin-bottom: 8px; text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>CPA-Compatible Transport</h1>
      <span class="version">v0.1.0</span>
    </header>
    <div class="profile" aria-label="Transport profile">
      <span>TLS client profile</span><strong>Chrome Auto (uTLS 1.8.2)</strong>
      <span>Application protocol</span><strong>HTTP/2</strong>
      <span>Reference</span><strong>CLIProxyAPI v7.2.142</strong>
    </div>
    <div class="setting">
      <div class="setting-copy">
        <strong>Enable transport</strong>
        <small>OpenAI OAuth request headers and bodies pass through unchanged.</small>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" aria-label="Enable transport">
        <span class="track" aria-hidden="true"></span>
      </label>
    </div>
    <div class="actions">
      <button id="save" class="primary" type="button">Save</button>
      <button id="test" type="button">Test configuration</button>
    </div>
    <output id="status" aria-live="polite">Loading configuration...</output>
  </main>
  <script>
    (() => {
      const token = new URLSearchParams(location.hash.slice(1)).get("bridge_token") || "";
      const enabled = document.getElementById("enabled");
      const save = document.getElementById("save");
      const test = document.getElementById("test");
      const status = document.getElementById("status");
      const pending = new Map();
      const requestID = () => crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

      const post = (type, payload = {}, expectsResponse = true) => {
        const request_id = requestID();
        parent.postMessage({ source: "sub2api-plugin-ui", bridge_token: token, type, request_id, ...payload }, "*");
        if (!expectsResponse) return Promise.resolve({});
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(request_id);
            reject(new Error("Request timed out"));
          }, 10000);
          pending.set(request_id, { resolve, reject, timer });
        });
      };

      const show = (message, error = false) => {
        status.textContent = message;
        status.dataset.error = String(error);
      };
      const busy = (value) => {
        save.disabled = value;
        test.disabled = value;
      };

      addEventListener("message", (event) => {
        if (event.source !== parent) return;
        const message = event.data || {};
        if (message.source !== "sub2api-plugin-host" || message.bridge_token !== token) return;
        const item = pending.get(message.request_id);
        if (!item) return;
        clearTimeout(item.timer);
        pending.delete(message.request_id);
        if (message.ok) item.resolve(message);
        else item.reject(new Error(message.error || "Operation failed"));
      });

      save.addEventListener("click", async () => {
        busy(true);
        try {
          const result = await post("config.save", { config: { enabled: enabled.checked } });
          enabled.checked = Boolean(result.config.enabled);
          show("Configuration saved");
        } catch (error) {
          show(error.message, true);
        } finally {
          busy(false);
        }
      });

      test.addEventListener("click", async () => {
        busy(true);
        try {
          await post("config.save", { config: { enabled: enabled.checked } });
          const result = await post("config.test");
          show(result.result.message || "Configuration is valid");
        } catch (error) {
          show(error.message, true);
        } finally {
          busy(false);
        }
      });

      post("sub2api.plugin.ready", {}, false);
      post("config.load").then((result) => {
        enabled.checked = Boolean(result.config.enabled);
        show("Configuration loaded");
        post("ui.resize", { height: document.documentElement.scrollHeight }, false);
      }).catch((error) => show(error.message, true));

      addEventListener("beforeunload", () => {
        for (const item of pending.values()) clearTimeout(item.timer);
        pending.clear();
      });
    })();
  </script>
</body>
</html>
