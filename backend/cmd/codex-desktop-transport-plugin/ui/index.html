<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Desktop rustls Transport</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 260px; }
    main { max-width: 720px; padding: 24px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 20px; }
    .version { color: color-mix(in srgb, CanvasText 62%, transparent); font: 12px/1.4 ui-monospace, monospace; }
    .profile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; margin: 24px 0; }
    .profile span { color: color-mix(in srgb, CanvasText 68%, transparent); }
    .profile strong { text-align: right; }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
    label.pin { display: block; margin-top: 16px; }
    input[type="text"] { min-height: 34px; margin-top: 6px; width: 100%; max-width: 220px; }
    .actions { display: flex; gap: 10px; margin-top: 24px; }
    button { min-height: 38px; padding: 8px 14px; }
    output { display: block; min-height: 22px; margin-top: 16px; }
    output[data-error="true"] { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Codex Desktop rustls Transport</h1>
      <span class="version">v0.1.0</span>
    </header>
    <div class="profile">
      <span>TLS</span><strong>Schannel TLS 1.2 HelloCustom (Desktop 26.903.9818 / engine 0.153.4)</strong>
      <span>HTTP</span><strong>HTTP/1.1 per-request</strong>
      <span>Portrait</span><strong>P2 filled; P3–P6 fallback</strong>
    </div>
    <label class="pin">Pin profile
      <input id="pin" type="text" placeholder="P2">
    </label>
    <div class="setting">
      <div>
        <strong>Enable transport</strong>
        <small>Headers pass through unchanged. Save with this on before host Enable.</small>
      </div>
      <label><input id="enabled" type="checkbox"> Enable</label>
    </div>
    <div class="actions">
      <button id="save" type="button">Save</button>
      <button id="test" type="button">Test configuration</button>
    </div>
    <output id="status">Loading configuration...</output>
  </main>
  <script>
    (() => {
      const token = new URLSearchParams(location.hash.slice(1)).get("bridge_token") || "";
      const enabled = document.getElementById("enabled");
      const pin = document.getElementById("pin");
      const save = document.getElementById("save");
      const test = document.getElementById("test");
      const status = document.getElementById("status");
      const pending = new Map();
      const requestID = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);

      const post = (type, payload = {}, expectsResponse = true) => {
        const request_id = requestID();
        parent.postMessage({ source: "sub2api-plugin-ui", bridge_token: token, type, request_id, ...payload }, "*");
        if (!expectsResponse) return Promise.resolve({});
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(request_id);
            reject(new Error("Request timed out"));
          }, 10000);
          pending.set(request_id, { resolve, reject, timer });
        });
      };

      const show = (message, error = false) => {
        status.textContent = message;
        status.dataset.error = String(error);
      };
      const busy = (value) => {
        save.disabled = value;
        test.disabled = value;
      };
      const currentConfig = () => ({
        enabled: enabled.checked,
        connection_reuse: "per_request",
        pin_profile: pin.value.trim(),
      });

      addEventListener("message", (event) => {
        if (event.source !== parent) return;
        const message = event.data || {};
        if (message.source !== "sub2api-plugin-host" || message.bridge_token !== token) return;
        const item = pending.get(message.request_id);
        if (!item) return;
        clearTimeout(item.timer);
        pending.delete(message.request_id);
        if (message.ok) item.resolve(message);
        else item.reject(new Error(message.error || "Operation failed"));
      });

      save.addEventListener("click", async () => {
        busy(true);
        try {
          const result = await post("config.save", { config: currentConfig() });
          enabled.checked = Boolean(result.config && result.config.enabled);
          if (result.config && result.config.pin_profile) pin.value = result.config.pin_profile;
          show("Configuration saved");
        } catch (error) {
          show(error.message, true);
        } finally {
          busy(false);
        }
      });

      test.addEventListener("click", async () => {
        busy(true);
        try {
          await post("config.save", { config: currentConfig() });
          const result = await post("config.test");
          show((result.result && result.result.message) || "Configuration is valid");
        } catch (error) {
          show(error.message, true);
        } finally {
          busy(false);
        }
      });

      post("sub2api.plugin.ready", {}, false);
      post("config.load").then((result) => {
        enabled.checked = Boolean(result.config && result.config.enabled);
        if (result.config && result.config.pin_profile) pin.value = result.config.pin_profile;
        show("Configuration loaded");
        post("ui.resize", { height: document.documentElement.scrollHeight }, false);
      }).catch((error) => show(error.message, true));
    })();
  </script>
</body>
</html>
